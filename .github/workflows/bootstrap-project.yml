name: Bootstrap project source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap-ready"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-project.zip.b64 > /tmp/granja-project.zip
          mkdir -p /tmp/granja-project
          unzip -q /tmp/granja-project.zip -d /tmp/granja-project
          project_dir="$(find /tmp/granja-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$project_dir"
          cp -a "$project_dir"/. .
          rm -rf .bootstrap-project.zip.b64 .bootstrap-ready .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish complete Granja Next.js application"
          git push origin HEAD:main
