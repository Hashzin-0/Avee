name: Bootstrap project source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap-ready"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap-project.tar.xz.b64 > /tmp/granja-project.tar.xz
          mkdir -p /tmp/granja-project
          tar -xJf /tmp/granja-project.tar.xz -C /tmp/granja-project
          cp -a /tmp/granja-project/project/. .
          rm -rf .bootstrap-project.tar.xz.b64 .bootstrap-ready .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish complete Granja Next.js application"
          git push origin HEAD:main
